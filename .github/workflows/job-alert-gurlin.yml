# Daglig job alert for Gurlin, sendt som mail omkring kl. 8 dansk tid.
# Opsætning og secrets: se GITHUB_ACTIONS.md.
name: Job Alert (Gurlin)

on:
  schedule:
    # GitHubs cron er i UTC. Begge tider planlægges, og gate-jobbet nedenfor lader kun den
    # køre, der svarer til 07:45 dansk tid (sommertid: 05:45 UTC, vintertid: 06:45 UTC).
    # Kørslen tager få minutter, og GitHub forsinker typisk planlagte kørsler 5-15 minutter.
    - cron: "45 5 * * *"
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Byg mailen uden at sende den"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-alert-gurlin
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Copenhagen date +%z)
          case "$SCHEDULE|$offset" in
            "|"*|"45 5 * * *|+0200"|"45 6 * * *|+0100") echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "Springer over: $SCHEDULE er ikke 07:45 dansk tid ($offset)" ;;
          esac

  alert:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      # Dublethukommelsen (hvilke opslag hun har fået) gemmes i Actions-cachen mellem kørsler.
      # Forsvinder cachen, forhindrer --since 1 at ældre opslag sendes igen.
      - name: Hent dublethukommelse
        uses: actions/cache/restore@v4
        with:
          path: state
          key: seen-gurlin-${{ github.run_id }}
          restore-keys: seen-gurlin-

      - name: Skriv profil fra secret
        env:
          JOB_PROFILE: ${{ secrets.GURLIN_PROFILE }}
        run: |
          if [ -z "$JOB_PROFILE" ]; then echo "Secret GURLIN_PROFILE mangler"; exit 1; fi
          printf '%s' "$JOB_PROFILE" > profile.json

      - name: Kør job alert
        env:
          RECIPIENT_EMAIL: ${{ secrets.GURLIN_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'send.one.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python job_alert.py --profile profile.json --since 1 --dry-run
          else
            python job_alert.py --profile profile.json --since 1
          fi

      - name: Gem dublethukommelse
        if: success() && hashFiles('state/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: seen-gurlin-${{ github.run_id }}
